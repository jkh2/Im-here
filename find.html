<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Someone — I'm Here!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --cream: #FBEFE0; --cream-2: #F6E4CF;
    --navy: #14233A; --navy-soft: #33445E;
    --coral: #E8624A; --coral-dark: #C94A34;
    --card: #FFFFFF; --panel-2: #FBF5EC; --line: #EAD9C4;
    --slate: #7B7264; --danger: #C94A34;
  }
  * { box-sizing:border-box; }
  html,body,#map { height:100%; margin:0; padding:0; }
  body { font-family:'Inter',sans-serif; color:var(--navy); background: var(--cream); }
  #map { position:absolute; inset:0; z-index:0; display:none; }
  #map.visible { display:block; }

  .entry-screen {
    position:absolute; inset:0; z-index:500; display:flex; align-items:center; justify-content:center; padding:24px;
    background: linear-gradient(160deg, #FCF4E8 0%, var(--cream) 45%, var(--cream-2) 100%);
  }
  .entry-screen.hidden { display:none; }
  .card {
    width:100%; max-width: 420px;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 32px 28px; box-shadow: 0 12px 40px rgba(20,35,58,0.10); text-align:center;
  }
  .eyebrow { font-family:'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--coral); margin: 0 0 8px; }
  h1 { font-family:'Plus Jakarta Sans', sans-serif; font-weight:800; font-size: 26px; margin: 0 0 6px; letter-spacing: -0.02em; color: var(--navy); }
  .sub { color: var(--navy-soft); font-size: 14px; margin: 0 0 24px; line-height:1.55; }
  .field input {
    width:100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px; color: var(--navy); font-family:'IBM Plex Mono', monospace; font-size: 18px;
    letter-spacing: 0.12em; text-align:center; text-transform:uppercase;
    margin-bottom: 14px;
  }
  .field input::placeholder { color: var(--slate); letter-spacing: normal; text-transform:none; font-family:'Inter',sans-serif; font-size:14px; }
  button {
    width:100%; font-family:'Plus Jakarta Sans', sans-serif; font-weight:700; font-size: 17px;
    padding: 15px; border-radius: 10px; border: none; cursor:pointer; background: var(--coral); color: #fff;
    transition: transform 0.1s ease;
  }
  button:active { transform: scale(0.98); }
  button:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
  .error-text { color: var(--danger); font-size: 13px; margin-top: 14px; display:none; }
  .note { font-size: 12px; color: var(--slate); margin-top: 18px; line-height:1.55; }

  .hud {
    position:absolute; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:10px;
    padding: 14px 18px;
    background: linear-gradient(to bottom, rgba(251,239,224,0.95), rgba(251,239,224,0));
    pointer-events:none; display:none;
  }
  .hud.visible { display:flex; pointer-events:none; }
  .hud * { pointer-events:auto; }
  .brand { font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:16px; color: var(--navy); }
  .brand span { color: var(--coral); }
  .pill {
    display:flex; align-items:center; gap:7px;
    background: var(--card); border:1px solid var(--line);
    padding: 7px 12px; border-radius: 999px; color: var(--navy);
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.06em;
    box-shadow: 0 2px 8px rgba(20,35,58,0.06);
  }
  .pdot { width:8px; height:8px; border-radius:50%; background: var(--coral); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  @media (prefers-reduced-motion: reduce) { .pdot { animation:none; } }
  .pill-row { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
  .leaflet-control-attribution { background: rgba(255,255,255,0.8) !important; color: var(--slate) !important; }
  .leaflet-control-attribution a { color: var(--coral-dark) !important; }
  .leaflet-popup-content-wrapper { background: var(--card); color: var(--navy); border:1px solid var(--line); border-radius:10px; }
  .leaflet-popup-tip { background: var(--card); }
  .popup-label { font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:14px; margin:0 0 4px; color: var(--navy); }
  .popup-meta { font-family:'IBM Plex Mono',monospace; font-size:11px; color: var(--slate); }
  .sos-link {
    position: fixed; top: 16px; right: 16px; z-index: 2000;
    background: var(--coral); color: #fff; text-decoration:none;
    font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em;
    padding: 8px 12px; border-radius: 999px; box-shadow: 0 6px 16px rgba(232,98,74,0.35);
  }
</style>
</head>
<body>
  <div id="map"></div>
  <a class="sos-link" href="sos.html">SOS</a>

  <div class="hud" id="hud">
    <div class="brand">I'm Here!<span>.</span></div>
    <div class="pill-row">
      <div class="pill"><span class="pdot"></span><span id="agoText">—</span></div>
      <div class="pill" id="expiryPill">—</div>
    </div>
  </div>

  <div class="entry-screen" id="entryScreen">
    <div class="card">
      <p class="eyebrow">I'm Here!</p>
      <h1 id="cardTitle">Find someone</h1>
      <p class="sub" id="cardSub">Enter the code they shared with you to see their live location.</p>
      <div class="field">
        <input type="text" id="codeInput" placeholder="Enter code" maxlength="8">
      </div>
      <button id="findBtn">Find</button>
      <p class="error-text" id="errorText"></p>
      <p class="note">Nobody is browsable here — a location only shows up if you have the exact code someone gave you.</p>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://eycxmnnbzbcjjnhkoetp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_C9hem1wdDzYbtLAbgbK6ZQ_FlJYxlzo';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const mapEl = document.getElementById('map');
  const hud = document.getElementById('hud');
  const entryScreen = document.getElementById('entryScreen');
  const cardTitle = document.getElementById('cardTitle');
  const cardSub = document.getElementById('cardSub');
  const codeInput = document.getElementById('codeInput');
  const findBtn = document.getElementById('findBtn');
  const errorText = document.getElementById('errorText');
  const agoText = document.getElementById('agoText');
  const expiryPill = document.getElementById('expiryPill');

  let map, marker;
  let expiresAt = null, lastUpdatedAt = null, currentCode = null, channel = null;

  function showEntry(title, sub) {
    entryScreen.classList.remove('hidden');
    hud.classList.remove('visible');
    mapEl.classList.remove('visible');
    if (title) cardTitle.textContent = title;
    if (sub) cardSub.textContent = sub;
  }

  function showMap() {
    entryScreen.classList.add('hidden');
    hud.classList.add('visible');
    mapEl.classList.add('visible');
    if (map) setTimeout(() => map.invalidateSize(), 50);
  }

  function ensureMap() {
    if (map) return;
    map = L.map('map', { zoomControl: true }).setView([39.8, -98.5], 4);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      maxZoom: 19
    }).addTo(map);
  }

  function render(row) {
    if (!row.is_live) {
      const msg = row.status === 'ended' ? "This share has ended." : "This share has expired.";
      showEntry("Not currently sharing", msg + " Ask them to start a new share if you still need to find them.");
      if (channel) { sb.removeChannel(channel); channel = null; }
      return;
    }

    ensureMap();
    showMap();
    lastUpdatedAt = new Date(row.updated_at);
    expiresAt = new Date(row.expires_at);

    if (!marker) {
      marker = L.circleMarker([row.lat, row.lng], {
        radius: 8, color: '#E8624A', weight: 2, fillColor: '#E8624A', fillOpacity: 1
      }).addTo(map);
      map.setView([row.lat, row.lng], 13);
    } else {
      marker.setLatLng([row.lat, row.lng]);
    }
    const title = row.label && row.label.trim() ? row.label.trim() : 'Live location';
    marker.bindPopup(`<p class="popup-label">${title}</p><p class="popup-meta">Updated just now</p>`);
    tick();
  }

  function tick() {
    if (!lastUpdatedAt) return;
    const secs = Math.round((Date.now() - lastUpdatedAt.getTime()) / 1000);
    agoText.textContent = secs < 60 ? `updated ${secs}s ago` : `updated ${Math.round(secs / 60)}m ago`;
    if (expiresAt) {
      const remaining = expiresAt.getTime() - Date.now();
      if (remaining <= 0) {
        expiryPill.textContent = 'expired';
      } else {
        const mins = Math.floor(remaining / 60000);
        const h = Math.floor(mins / 60), m = mins % 60;
        expiryPill.textContent = h > 0 ? `ends in ${h}h ${m}m` : `ends in ${m}m`;
      }
    }
  }
  setInterval(tick, 1000);

  async function lookup(code) {
    errorText.style.display = 'none';
    currentCode = code;
    const { data, error } = await sb.rpc('get_share', { p_code: code });
    if (error) {
      errorText.textContent = 'Something went wrong: ' + error.message;
      errorText.style.display = 'block';
      return;
    }
    const row = Array.isArray(data) ? data[0] : data;
    if (!row) {
      showEntry('Find someone', 'No trip found for that code — check it and try again.');
      return;
    }
    render(row);

    if (channel) sb.removeChannel(channel);
    channel = sb.channel('share:' + code);
    channel.on('broadcast', { event: 'update' }, ({ payload }) => render(payload)).subscribe();
  }

  findBtn.addEventListener('click', () => {
    const code = codeInput.value.trim().toUpperCase();
    if (!code) return;
    lookup(code);
  });
  codeInput.addEventListener('keydown', e => { if (e.key === 'Enter') findBtn.click(); });

  const params = new URLSearchParams(window.location.search);
  const codeParam = params.get('code');
  if (codeParam) {
    codeInput.value = codeParam.toUpperCase();
    lookup(codeParam.toUpperCase());
  }
</script>
</body>
</html>
